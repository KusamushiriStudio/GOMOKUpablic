<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#14432f">
<title>TRIAD — 超次元五目</title>
<style>
/* TRIAD — 超次元五目 : 和風UI
   基調色: 深い緑 / 生成り / 淡い緑 */

:root {
  --green-900: #0e2f21;
  --green-800: #14432f;
  --green-700: #1f6f4a;
  --green-500: #3f8f5c;
  --green-200: #cfe0cd;
  --green-100: #e4eede;
  --cream: #f4efe1;
  --cream-2: #eae2cd;
  --ink: #24301f;
  --ink-soft: #55604c;
  --sumi: #2b2b2b;
  --accent: #c0362c;
  --gold: #c9a227;
  --p1: #1f6f4a;
  --p2: #b5462f;
  --p3: #2f5d94;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(20, 45, 30, .16);
  --nav-h: 60px;
  --header-h: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

/* hidden 属性を必ず優先する（display を明示した要素が操作を奪わないように） */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  max-width: 100%;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100svh;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(63, 143, 92, .10), transparent 46%),
    radial-gradient(circle at 88% 92%, rgba(20, 67, 47, .10), transparent 44%);
}

button { font-family: inherit; font-size: inherit; color: inherit; }

.app {
  display: flex;
  flex-direction: column;
  min-height: 100svh;
}

/* ───────── ヘッダー ───────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: calc(6px + var(--safe-t)) 10px 6px;
  min-height: var(--header-h);
  background: linear-gradient(180deg, var(--green-800), var(--green-900));
  color: var(--cream);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
}
.brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.brand-mark {
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--green-200) 60%, var(--green-500));
  flex: none; align-self: center;
}
.brand-name { font-family: var(--font); font-size: 19px; letter-spacing: .14em; font-weight: 700; }
.brand-sub { font-size: 10px; opacity: .78; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 6px; flex: none; }
.badge {
  font-size: 10px; letter-spacing: .1em; padding: 3px 7px; border-radius: 999px;
  border: 1px solid rgba(244, 239, 225, .5);
}
.badge[data-mode="ONLINE"] { background: var(--gold); color: #34280a; border-color: transparent; font-weight: 700; }
.perica {
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(244, 239, 225, .14); border-radius: 999px; padding: 3px 9px;
  font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700;
}
.perica-mark { color: var(--gold); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(244, 239, 225, .4);
  background: transparent; color: var(--cream); cursor: pointer; line-height: 1;
}
.icon-btn[aria-pressed="true"] { background: var(--accent); border-color: transparent; }

/* ───────── メイン ───────── */
.app-main {
  flex: 1 1 auto;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 10px calc(var(--nav-h) + var(--safe-b) + 18px);
  outline: none;
}
.app-main.has-actionbar { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 96px); }

/* ───────── ナビ ───────── */
.app-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: linear-gradient(180deg, #1b5439, var(--green-900));
  padding-bottom: var(--safe-b);
  border-top: 1px solid rgba(244, 239, 225, .18);
}
.app-nav button {
  appearance: none; border: 0; background: transparent; color: rgba(244, 239, 225, .72);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--nav-h); font-size: 10px; cursor: pointer; padding: 0 2px; min-width: 0;
}
.app-nav button .nav-ico { font-size: 17px; font-family: var(--font); line-height: 1; }
.app-nav button[aria-current="page"] { color: #fff; background: rgba(244, 239, 225, .12); }

/* ───────── 共通パーツ ───────── */
.card {
  background: #fffdf6;
  border: 1px solid var(--cream-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
  margin-bottom: 12px;
}
.card > h2, .section-title {
  margin: 0 0 8px;
  font-family: var(--font);
  font-size: 15px;
  letter-spacing: .08em;
  color: var(--green-800);
  display: flex; align-items: center; gap: 7px;
}
.section-title::before {
  content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--green-700);
}
.muted { color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }

.btn {
  appearance: none; border: 1px solid var(--green-700); border-radius: 10px;
  background: var(--green-700); color: #fff; padding: 10px 14px; font-weight: 700;
  cursor: pointer; min-height: 44px; font-size: 14px; line-height: 1.2;
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--green-800); }
.btn.sub { background: #fff; color: var(--green-800); border-color: var(--cream-2); }
.btn.danger { background: var(--accent); border-color: var(--accent); }
.btn.gold { background: linear-gradient(180deg, #d9b843, #b48c1c); border-color: #9c7a17; color: #33280a; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--cream-2); background: #fff; border-radius: 999px;
  padding: 6px 11px; font-size: 12px; cursor: pointer; min-height: 34px;
}
.chip[aria-pressed="true"] { background: var(--green-700); color: #fff; border-color: var(--green-700); }

.pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
.pill.SSR { background: linear-gradient(90deg, #f6d365, #c9a227); color: #3a2c05; }
.pill.SR { background: #cbb6e8; color: #34204f; }
.pill.R { background: #b9d7ef; color: #17364f; }
.pill.N { background: var(--green-100); color: var(--green-800); }
.pill.new { background: var(--accent); color: #fff; }
.pill.dup { background: #ddd6c4; color: #4b4433; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }

.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; }
.kv b { font-variant-numeric: tabular-nums; }

.bar { height: 6px; border-radius: 3px; background: var(--cream-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green-500); }

.notice {
  border-left: 4px solid var(--gold); background: #fdf6e3; padding: 8px 10px;
  border-radius: 8px; font-size: 12px; line-height: 1.6; margin-bottom: 10px;
}
.notice.error { border-left-color: var(--accent); background: #fdecea; }

/* ───────── 盤面 ───────── */
.board-wrap {
  position: relative;
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--cream-2);
  box-shadow: var(--shadow);
  background: var(--cream-2);
  touch-action: manipulation;
}
.board-scroll { max-height: min(62svh, 620px); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.board-svg { display: block; width: 100%; height: auto; }
.board-svg .hit { fill: transparent; }

.turn-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.seat-card {
  border: 1px solid var(--cream-2); border-radius: 10px; background: #fffdf6; padding: 6px;
  font-size: 11px; position: relative; overflow: hidden; min-width: 0;
}
.seat-card[data-active="true"] { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(31,111,74,.18); }
.seat-card[data-disconnected="true"] { opacity: .6; }
.seat-head { display: flex; align-items: center; gap: 4px; font-weight: 700; }
.seat-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.seat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-meta { display: flex; gap: 6px; margin-top: 3px; color: var(--ink-soft); font-size: 10px; flex-wrap: wrap; }
.seat-art { display: flex; justify-content: center; margin: 2px 0; }
.seat-art svg { width: 40px; height: 50px; }
.energy-dots { display: flex; gap: 2px; margin-top: 4px; }
.energy-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--cream-2); display: block; }
.energy-dots i.on { background: var(--gold); }

/* 確定バー */
.action-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--nav-h) + var(--safe-b));
  z-index: 35;
  background: rgba(255, 253, 246, .97);
  border-top: 1px solid var(--cream-2);
  box-shadow: 0 -3px 14px rgba(20, 45, 30, .14);
  padding: 8px 10px;
}
.action-bar-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.action-bar .label { flex: 1 1 auto; font-size: 12px; line-height: 1.35; min-width: 0; }
.action-bar .label b { font-size: 14px; }

/* ───────── キャラ表示 ───────── */
.char-card {
  border: 1px solid var(--cream-2); border-radius: 12px; background: #fffdf6;
  padding: 8px; text-align: center; cursor: pointer; min-width: 0;
}
.char-card[aria-pressed="true"] { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(31,111,74,.18); }
.char-card[data-locked="true"] { opacity: .5; }
.char-card .name { font-size: 12px; font-weight: 700; margin-top: 4px; }
.char-card .sub { font-size: 10px; color: var(--ink-soft); }
.char-art { width: 100%; height: auto; display: block; }

.item-card {
  border: 1px solid var(--cream-2); border-radius: 10px; background: #fffdf6; padding: 6px;
  text-align: center; cursor: pointer; font-size: 11px; min-width: 0;
}
.item-card[aria-pressed="true"] { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(31,111,74,.18); }
.item-card .thumb { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--cream-2); }
.item-card .thumb svg { width: 100%; height: 100%; display: block; }
.item-card .nm { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-card .eq { color: var(--green-700); font-weight: 700; font-size: 10px; }

/* ───────── ガチャ結果 ───────── */
.gacha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.gacha-cell { border-radius: 10px; padding: 6px; text-align: center; border: 1px solid var(--cream-2); background: #fffdf6; }
.gacha-cell.is-new { box-shadow: 0 0 0 2px var(--accent) inset; }

/* ───────── 表 ───────── */
.table { width: 100%; border-collapse: collapse; font-size: 11px; }
.table th, .table td { border-bottom: 1px solid var(--cream-2); padding: 5px 4px; text-align: left; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; max-width: 100%; }

/* ───────── 入力 ───────── */
input[type="text"], input[type="number"], select {
  font: inherit; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--cream-2);
  background: #fff; color: var(--ink); min-height: 42px; width: 100%; max-width: 100%;
}
input[type="range"] { width: 100%; }
label.field { display: block; font-size: 12px; margin-bottom: 8px; }
label.field > span { display: block; margin-bottom: 4px; color: var(--ink-soft); }
.code-input { letter-spacing: .34em; text-transform: uppercase; font-family: ui-monospace, monospace; text-align: center; font-size: 20px; }

/* ───────── トースト・ダイアログ ───────── */
.toast-layer {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
  z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center;
  width: min(94vw, 520px); pointer-events: none;
}
.toast {
  background: rgba(20, 45, 30, .94); color: var(--cream); padding: 9px 13px; border-radius: 10px;
  font-size: 12.5px; line-height: 1.5; box-shadow: var(--shadow); max-width: 100%;
  animation: toastIn .18s ease-out;
}
.toast.error { background: #7c1f18; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.dialog-layer {
  position: fixed; inset: 0; z-index: 70; background: rgba(14, 30, 22, .5);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.dialog {
  background: #fffdf6; border-radius: 16px; padding: 16px; width: min(94vw, 400px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
}
.dialog h3 { margin: 0 0 8px; font-family: var(--font); font-size: 16px; color: var(--green-800); }
.dialog p { margin: 0 0 14px; font-size: 13px; line-height: 1.65; }
.dialog .row { justify-content: flex-end; }

/* ───────── 演出レイヤー ───────── */
.fx-layer {
  position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden;
}
.fx-banner {
  position: absolute; left: 50%; top: 16%; transform: translateX(-50%);
  background: rgba(20, 45, 30, .9); color: var(--cream); padding: 8px 18px; border-radius: 999px;
  font-family: var(--font); letter-spacing: .12em; font-size: 15px; white-space: nowrap;
  animation: fxBanner 1.1s ease-out forwards;
}
@keyframes fxBanner {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); }
  16% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -8px); }
}
.fx-node { position: absolute; pointer-events: none; }

/* 結界破壊で回復したエナジーの表示（文字だけ。盤面には影響しない） */
.fx-energy {
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .06em;
  color: #ffe9a3;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .75), 0 0 8px rgba(201, 162, 39, .8);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  .fx-node, .fx-banner { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  * { scroll-behavior: auto !important; }
}

/* ───────── PC: サイドバー ───────── */
@media (min-width: 900px) {
  .app { flex-direction: row; }
  .app-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 45;
  }
  .app-nav {
    position: fixed; top: var(--header-h); bottom: 0; left: 0; right: auto;
    width: 168px; grid-template-columns: 1fr; align-content: start;
    padding-top: 10px; border-top: 0; border-right: 1px solid rgba(244, 239, 225, .18);
  }
  .app-nav button { flex-direction: row; justify-content: flex-start; gap: 10px; height: 46px; padding: 0 16px; font-size: 13px; }
  .app-main {
    margin-left: 168px; margin-top: var(--header-h);
    max-width: 760px; padding-bottom: 120px;
  }
  .app-main.has-actionbar { padding-bottom: 140px; }
  .action-bar { left: 168px; bottom: 0; }
  .action-bar-inner { max-width: 760px; margin: 0 0 0 8px; }
  .toast-layer { bottom: 90px; }
  .board-scroll { max-height: min(72svh, 760px); }
}

/* 極小幅 */
@media (max-width: 340px) {
  .brand-sub { display: none; }
  .app-nav button { font-size: 9px; }
  .app-main { padding-left: 8px; padding-right: 8px; }
  .card { padding: 10px; }
}

/* ───────────────── 物語：季節と天候の情景 ───────────────── */

.scene {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  padding: 14px 14px 12px;
  margin: -2px 0 10px;
  color: var(--ink);
  background: linear-gradient(180deg, var(--scene-top, #e8dcc0), var(--scene-bottom, #d6d8be));
  border: 1px solid rgba(0, 0, 0, .08);
}
.scene.dark { color: #f2ece0; }
.scene.dark .scene-sub { color: rgba(242, 236, 224, .78); }
.scene-title { font-family: var(--font); font-size: 15px; letter-spacing: .06em; font-weight: 700; }
.scene-sub { font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin-top: 4px; }
.scene-body { position: relative; z-index: 1; }

/* 季節ごとの地色 */
.scene[data-season="spring"] { --scene-top: #f4e3e8; --scene-bottom: #e6d3d9; }
.scene[data-season="rainy"]  { --scene-top: #dfe7e6; --scene-bottom: #c6d3d1; }
.scene[data-season="summer"] { --scene-top: #f6e2cf; --scene-bottom: #e8c6a6; }
.scene[data-season="autumn"] { --scene-top: #f2ddcd; --scene-bottom: #e2bfa8; }
.scene[data-season="winter"] { --scene-top: #e6eef5; --scene-bottom: #ccdae6; }
.scene[data-season="all"]    { --scene-top: #ece5d6; --scene-bottom: #d9d4c0; }

/* 夜・虚空は暗く */
.scene[data-time="night"], .scene[data-time="void"] { --scene-top: #2a2436; --scene-bottom: #1b1726; }
.scene[data-time="evening"] { --scene-top: #f0d7c0; --scene-bottom: #d9ab8d; }
.scene[data-time="dawn"] { --scene-top: #efe0e6; --scene-bottom: #d7c8d6; }

/* 天候の粒（動きが苦手な人には止める） */
.scene-fx { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .55; }
.scene-fx i {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: var(--fx-color, #fff);
  animation: scene-fall var(--fx-dur, 7s) linear infinite;
  animation-delay: var(--fx-delay, 0s);
}
.scene[data-weather="petals"] .scene-fx i,
.scene[data-weather="maple-storm"] .scene-fx i { border-radius: 40% 60% 45% 55%; }
.scene[data-weather="petals"] .scene-fx { --fx-color: #f0c2cf; }
.scene[data-weather="maple-storm"] .scene-fx { --fx-color: #c9603f; }
.scene[data-weather="rain"] .scene-fx i,
.scene[data-weather="storm"] .scene-fx i,
.scene[data-weather="thunder"] .scene-fx i { border-radius: 2px; width: 1.5px !important; height: 11px !important; }
.scene[data-weather="rain"] .scene-fx { --fx-color: #9fb8c4; }
.scene[data-weather="storm"] .scene-fx { --fx-color: #cfe0ea; opacity: .75; }
.scene[data-weather="snow"] .scene-fx,
.scene[data-weather="blizzard"] .scene-fx { --fx-color: #ffffff; }
.scene[data-weather="ash"] .scene-fx { --fx-color: #d8cfc4; }
.scene[data-weather="firestorm"] .scene-fx { --fx-color: #e8894a; opacity: .8; }
.scene[data-weather="fog"] .scene-fx { --fx-color: #e9e3ee; opacity: .3; }
.scene[data-weather="aurora"] .scene-fx { --fx-color: #8fe0c6; opacity: .5; }
.scene[data-weather="clear"] .scene-fx,
.scene[data-weather="haze"] .scene-fx,
.scene[data-weather="void"] .scene-fx,
.scene[data-weather="shifting"] .scene-fx { display: none; }

@keyframes scene-fall {
  from { transform: translate3d(0, -20%, 0) rotate(0deg); }
  to { transform: translate3d(var(--fx-drift, 12px), 320%, 0) rotate(220deg); }
}
@media (prefers-reduced-motion: reduce) {
  .scene-fx i { animation: none; opacity: .35; }
}

/* ───────────────── 物語：ボスの段階変化 ───────────────── */

.boss-figure { position: relative; display: inline-block; }
.boss-figure[data-phase="1"] .char-art { filter: saturate(1.25) contrast(1.08); }
.boss-figure[data-phase="2"] .char-art { filter: saturate(1.5) contrast(1.2) hue-rotate(-12deg); }
.boss-figure[data-phase="1"]::after,
.boss-figure[data-phase="2"]::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(230, 120, 60, .30), transparent 68%);
  animation: boss-pulse 2.4s ease-in-out infinite;
}

/** いま物語で鳴らすべき環境音 */

    if (st && st.status === 'playing') {

function boot() {

    if (s.width !== 11 || s.height !== 17) {

    window.removeEventListener('pointerdown', unlock);
    window.removeEventListener('keydown', unlock);
  };
  window.addEventListener('pointerdown', unlock, { once: false });
  window.addEventListener('keydown', unlock, { once: false });

      if (activeNet() !== backend) return;
      handleOnlineView(view);
      if (app.mode === 'ONLINE') render();

    backend.on('status', () => { if (app.mode === 'ONLINE' && activeNet() === backend) render(); });

  localStore.onChange(() => render());

  window.addEventListener('resize', () => { if (app.view === 'play') render(); });

    const r = readRoute();
    app.view = r.view;
    if (r.room) app.pendingRoomCode = r.room;
    render();
  });

  app.view = route.view;
  app.pendingRoomCode = route.room;

  render();
  detectOnlineBackend();

/**
 * オンライン対戦の接続先を決める。
 *  1. 同一オリジンの Node.js サーバー（誰でも参加できる本来のオンライン対戦）
 *  2. アカウント接続（このページを開ける人どうしの対戦）
 */
async function detectOnlineBackend() {
  // 0. Supabase（世界対戦）。設定が配られているときだけ使う。
  if (supaNet.available) {
    const s = await supaNet.ensureSession().catch(() => ({ ok: false }));
    if (s.ok) {
      app.onlineKind = 'supabase';
      app.config = { onlineEnabled: true, mode: 'supabase' };
      supaNet.connect();
      supaNet.resolvePending().then((list) => {
        const resolved = list.filter((x) => x.r.ok);
        if (resolved.length) toast(`未確認だった${resolved.length}件の操作の確定結果を反映しました。`);
      }).catch(() => {});
      render();
      return;
    }
    if (s.code === 'anonymous_disabled') {
      toast('ゲスト参加が有効になっていないため、オンライン対戦を開始できません。', 'error', 8000);
    }
  }

  const canProbeServer = !window.__TRIAD_LOCAL_ONLY__ && /^https?:$/.test(location.protocol);
  if (canProbeServer) {
    try {
      const cfg = await fetch('/api/config').then((r) => r.json()).catch(() => null);
      if (cfg && cfg.ok) {
        app.config = cfg;
        net.setTurnstileSiteKey(cfg.turnstile?.enabled ? cfg.turnstile.siteKey : null);
      }
      const h = await fetch('/api/health').then((r) => r.json());
      if (h && h.ok) {
        app.onlineKind = 'server';
        net.connect();
        net.resolvePending().then((list) => {
          const resolved = list.filter((x) => x.r.ok);
          if (resolved.length) toast(`未確認だった${resolved.length}件の操作の確定結果を反映しました。`);
        }).catch(() => {});
        syncUrl();
        render();
        return;
      }
    } catch { /* サーバーが無ければアカウント接続を試す */ }
  }
  try {
    const ok = await dbNet.ensure();
    if (ok) {
      app.onlineKind = 'account';
      dbNet.connect();
      render();
      return;
    }
  } catch { /* 利用できない場合はローカル専用 */ }
  app.onlineKind = null;
  render();
}

function handleOnlineView(view) {
  const m = view?.match;
  // 世界対戦が成立したら、待っている画面から対戦画面へ自動で移る
  if (m && m.status === 'playing' && app.onlineFxMatch !== m.matchId
    && (app.view === 'online' || app.view === 'ranking')) {
    app.view = 'play';
  }
  if (!m) { app.onlineFxMatch = null; return; }
  if (app.onlineFxMatch !== m.matchId) {
    // 初回受信・再接続時は過去の演出をまとめて再生しない
    app.onlineFxMatch = m.matchId;
    fx.markSeen(m.events || []);
    return;
  }
  for (const ev of m.events || []) fx.play(ev, getBoardView());
}

let booted = false;
function bootOnce() {
  if (booted) return;
  booted = true;
  boot();

  }
  for (const id of Object.values(DEFAULT_EQUIP)) base.cosmetics[id] = Math.max(1, base.cosmetics[id] || 0);

  // 装備（旧形式: 単一 equip オブジェクト）
  const legacyEquip = raw.equip && typeof raw.equip === 'object' ? raw.equip : null;
  if (raw.equipByChar && typeof raw.equipByChar === 'object') {
    for (const [charId, eq] of Object.entries(raw.equipByChar)) {
      if (!CHARACTER_BY_ID[charId] || !eq || typeof eq !== 'object') continue;
      for (const slot of ['outfit', 'accessory']) {
        const id = eq[slot];
        if (COSMETIC_BY_ID[id] && COSMETIC_BY_ID[id].slot === slot && (base.cosmetics[id] || 0) > 0) {
          base.equipByChar[charId][slot] = id;
        }
      }
    }
  } else if (legacyEquip) {
    for (const charId of Object.keys(base.equipByChar)) {
      for (const slot of ['outfit', 'accessory']) {
        const id = legacyEquip[slot];
        if (COSMETIC_BY_ID[id] && COSMETIC_BY_ID[id].slot === slot && (base.cosmetics[id] || 0) > 0) {
          base.equipByChar[charId][slot] = id;
        }
      }
    }
  }
  const commonSrc = (raw.equipCommon && typeof raw.equipCommon === 'object') ? raw.equipCommon : legacyEquip;
  if (commonSrc) {
    for (const slot of ['board', 'stone']) {
      const id = commonSrc[slot];
      if (COSMETIC_BY_ID[id] && COSMETIC_BY_ID[id].slot === slot && (base.cosmetics[id] || 0) > 0) {
        base.equipCommon[slot] = id;
      }
    }
  }

  if (typeof raw.lastCharId === 'string' && CHARACTER_BY_ID[raw.lastCharId] && base.chars[raw.lastCharId].owned) {
    base.lastCharId = raw.lastCharId;
  }

  // ミッション・カウンタ
  if (raw.missions && typeof raw.missions === 'object') {
    for (const [id, v] of Object.entries(raw.missions)) {
      if (!MISSION_BY_ID[id]) continue;
      base.missions[id].claimed = !!(typeof v === 'boolean' ? v : v?.claimed);
    }
  }
  if (raw.counters && typeof raw.counters === 'object') {
    const c = raw.counters;
    base.counters.matchesCompleted = clampInt(c.matchesCompleted, 0, 1e9, 0);
    base.counters.stonesPlaced = clampInt(c.stonesPlaced, 0, 1e9, 0);
    base.counters.skillsUsed = clampInt(c.skillsUsed, 0, 1e9, 0);
    base.counters.wins = clampInt(c.wins, 0, 1e9, 0);
    if (Array.isArray(c.charsUsed)) {
      base.counters.charsUsed = [...new Set(c.charsUsed.filter((x) => CHARACTER_BY_ID[x]))];
    }
  }

  // ガチャ履歴（検証付き移行）
  if (Array.isArray(raw.gachaHistory)) {
    base.gachaHistory = raw.gachaHistory
      .filter((h) => h && typeof h === 'object' && typeof h.drawId === 'string')
      .map((h) => ({
        at: clampInt(h.at, 0, Number.MAX_SAFE_INTEGER, 0),
        drawId: h.drawId,
        name: typeof h.name === 'string' ? h.name.slice(0, 40) : h.drawId,
        rarity: ['SSR', 'SR', 'R', 'N'].includes(h.rarity) ? h.rarity : 'N',
        isNew: !!h.isNew,
        rates: (h.rates && typeof h.rates === 'object') ? h.rates : weightsToRates(defaultWeights()),
      }))
      .slice(-GACHA_HISTORY_LIMIT);
  }

  if (raw.ledger && typeof raw.ledger === 'object') {
    for (const [reqId, v] of Object.entries(raw.ledger)) {
      if (typeof reqId !== 'string' || reqId.length > 128) continue;
      if (!v || typeof v !== 'object') continue;
      base.ledger[reqId] = { hash: String(v.hash ?? ''), result: v.result ?? null, at: clampInt(v.at, 0, Number.MAX_SAFE_INTEGER, 0) };
    }
  }
  if (raw.ledgerIds && typeof raw.ledgerIds === 'object') {
    for (const [reqId, h] of Object.entries(raw.ledgerIds)) {
      if (typeof reqId !== 'string' || reqId.length > 128) continue;
      if (typeof h !== 'string' || h.length > 64) continue;
      base.ledgerIds[reqId] = h;
    }
  }
  for (const [reqId, v] of Object.entries(base.ledger)) base.ledgerIds[reqId] = String(v.hash ?? '');
  if (raw.rewardedMatches && typeof raw.rewardedMatches === 'object') {
    for (const k of Object.keys(raw.rewardedMatches)) if (typeof k === 'string') base.rewardedMatches[k] = true;
  }
  if (raw.gachaRates && typeof raw.gachaRates === 'object') {
    const v = ratesToWeights(raw.gachaRates);
    if (v.ok) base.gachaRates = { ...raw.gachaRates };
  }

  // ── 物語（V3 → V4 の移行）
  // V3 までの保存には story が無い。既定値を入れるだけで、
  // 既存のペリカ・所持・装備・戦績には一切触れない。
  base.story = migrateStory(raw.story, base);

  base.updatedAt = Date.now();
  return base;
}

/**
 * 物語領域の検証つき移行。V3 以前（story が無い）は既定値で作る。
 * 不正な値は捨てるだけで、プロフィール全体を壊さない。
 */
function migrateStory(rawStory, base) {
  const story = createStoryArea();
  if (!rawStory || typeof rawStory !== 'object') return story;

  const inRange = (n) => Number.isInteger(n) && n >= 1 && n <= STORY_STAGE_COUNT;

  if (rawStory.cleared && typeof rawStory.cleared === 'object') {
    for (const [k, v] of Object.entries(rawStory.cleared)) {
      const id = Number(k);
      if (!inRange(id)) continue;
      if (v === true) { story.cleared[id] = { first: 0, clears: 1 }; continue; }
      if (!v || typeof v !== 'object') continue;
      story.cleared[id] = {
        first: clampInt(v.first, 0, Number.MAX_SAFE_INTEGER, 0),
        clears: clampInt(v.clears, 1, 1e6, 1),
      };
    }
  }
  if (rawStory.rewarded && typeof rawStory.rewarded === 'object') {
    for (const k of Object.keys(rawStory.rewarded)) {
      const id = Number(k);
      // 報酬済みの記録は、制覇の記録があるものだけ引き継ぐ（二重取りも取りこぼしも防ぐ）
      if (inRange(id) && story.cleared[id]) story.rewarded[id] = true;
    }
  }
  if (rawStory.drops && typeof rawStory.drops === 'object') {
    for (const k of Object.keys(rawStory.drops)) {
      const c = COSMETIC_BY_ID[k];
      if (c && c.storyDrop) story.drops[k] = true;
    }
  }
  const SKILL_IDS = new Set(SKILL_UNLOCKS.map((u) => u.skillId));
  const SEAL_IDS = new Set(Object.values(SEAL_BY_STAGE).map((x) => x.id));
  if (Array.isArray(rawStory.skills)) {
    story.skills = [...new Set(rawStory.skills.filter((x) => SKILL_IDS.has(x)))];
  }
  if (Array.isArray(rawStory.seals)) {
    // 旧形式（キャラクターIDで保存していた版）からの引き継ぎ
    for (const x of rawStory.seals) {
      if (SEAL_IDS.has(x)) story.seals.push(x);
      else {
        const u = SKILL_UNLOCKS.find((k) => k.charId === x);
        if (u && !story.skills.includes(u.skillId)) story.skills.push(u.skillId);
      }
    }
    story.seals = [...new Set(story.seals)];
  }
  if (rawStory.readTalks && typeof rawStory.readTalks === 'object') {
    for (const k of Object.keys(rawStory.readTalks)) {
      if (/^\d{1,2}:(intro|clear)$/.test(k)) story.readTalks[k] = true;
    }
  }
  // 習得済みの術と碁印は、制覇済みステージから引き直せる（記録が壊れていても復元できる）
  for (const u of SKILL_UNLOCKS) {
    if (story.cleared[u.stage] && !story.skills.includes(u.skillId)) story.skills.push(u.skillId);
  }
  for (const [stage, seal] of Object.entries(SEAL_BY_STAGE)) {
    if (story.cleared[stage] && !story.seals.includes(seal.id)) story.seals.push(seal.id);
  }
  const ids = Object.keys(story.cleared).map(Number);
  story.maxStage = ids.length ? Math.min(STORY_STAGE_COUNT, Math.max(...ids)) : 0;
  story.lastStage = inRange(Number(rawStory.lastStage))
    ? Number(rawStory.lastStage)
    : Math.min(STORY_STAGE_COUNT, story.maxStage + 1) || 1;
  story.activeMatchId = null; // 進行中の試合はセッションをまたいで引き継がない

  // 物語で得た着せ替えは所持にも反映しておく（V3 保存には入っていないため）
  for (const id of Object.keys(story.drops)) {
    base.cosmetics[id] = Math.max(1, base.cosmetics[id] || 0);
  }
  return story;
}

/* ───────────────────────── レベル ───────────────────────── */

function playerLevel(xp) {
  return 1 + Math.floor(Math.max(0, xp) / PLAYER_XP_PER_LEVEL);
}
function charLevel(xp) {
  return 1 + Math.floor(Math.max(0, xp) / CHAR_XP_PER_LEVEL);
}
function playerLevelProgress(xp) {
  const into = Math.max(0, xp) % PLAYER_XP_PER_LEVEL;
  return { into, need: PLAYER_XP_PER_LEVEL, ratio: into / PLAYER_XP_PER_LEVEL };
}
function charLevelProgress(xp) {
  const into = Math.max(0, xp) % CHAR_XP_PER_LEVEL;
  return { into, need: CHAR_XP_PER_LEVEL, ratio: into / CHAR_XP_PER_LEVEL };
}

/* ───────────────────────── 所持・装備 ───────────────────────── */

function ownedCharacters(profile) {
  return CHARACTERS.filter((c) => profile.chars[c.id]?.owned);
}
function ownsCharacter(profile, id) {
  return !!profile.chars[id]?.owned;
}
function ownsCosmetic(profile, id) {
  return (profile.cosmetics?.[id] || 0) > 0;
}
function ownedCosmetics(profile, slot) {
  return COSMETICS.filter((c) => (!slot || c.slot === slot) && ownsCosmetic(profile, c.id));
}

/**
 * 装備を変更する。未所持 / 存在しない ID / 別スロットは拒否する。
 * @returns {{ok:true} | {ok:false, message:string}}
 */
function equipCosmetic(profile, { slot, id, charId }) {
  if (!COSMETIC_SLOTS.includes(slot)) return { ok: false, message: 'そのスロットは存在しません。' };
  const cos = COSMETIC_BY_ID[id];
  if (!cos) return { ok: false, message: 'そのアイテムは存在しません。' };
  if (cos.slot !== slot) return { ok: false, message: `「${cos.name}」は${slot}スロットには装備できません。` };
  if (!ownsCosmetic(profile, id)) return { ok: false, message: `「${cos.name}」を所持していません。` };

  if (slot === 'outfit' || slot === 'accessory') {
    if (!CHARACTER_BY_ID[charId]) return { ok: false, message: '対象キャラクターが不正です。' };
    if (!ownsCharacter(profile, charId)) return { ok: false, message: 'そのキャラクターを所持していません。' };
    profile.equipByChar[charId] = profile.equipByChar[charId] || { ...DEFAULT_EQUIP };
    profile.equipByChar[charId][slot] = id;
  } else {
    profile.equipCommon[slot] = id;
  }
  profile.updatedAt = Date.now();
  return { ok: true };
}

function resetEquipToDefault(profile, { scope = 'all', charId = null } = {}) {
  if (scope === 'all' || scope === 'char') {
    const targets = charId ? [charId] : Object.keys(profile.equipByChar);
    for (const id of targets) {
      profile.equipByChar[id] = { outfit: DEFAULT_EQUIP.outfit, accessory: DEFAULT_EQUIP.accessory };
    }
  }
  if (scope === 'all' || scope === 'common') {
    profile.equipCommon = { board: DEFAULT_EQUIP.board, stone: DEFAULT_EQUIP.stone };
  }
  profile.updatedAt = Date.now();
  return { ok: true };
}

/** 対戦で使う見た目一式 */
function appearanceFor(profile, charId) {
  const eq = profile.equipByChar?.[charId] || { outfit: DEFAULT_EQUIP.outfit, accessory: DEFAULT_EQUIP.accessory };
  return {
    charId,
    outfit: ownsCosmetic(profile, eq.outfit) ? eq.outfit : DEFAULT_EQUIP.outfit,
    accessory: ownsCosmetic(profile, eq.accessory) ? eq.accessory : DEFAULT_EQUIP.accessory,
    stone: ownsCosmetic(profile, profile.equipCommon?.stone) ? profile.equipCommon.stone : DEFAULT_EQUIP.stone,
    board: ownsCosmetic(profile, profile.equipCommon?.board) ? profile.equipCommon.board : DEFAULT_EQUIP.board,
  };
}

/* ───────────────────────── 台帳（二重処理防止） ───────────────────────── */

/** 依存のない簡易ハッシュ（本文一致の検出用。暗号用途ではない） */
function bodyHash(obj) {
  const s = JSON.stringify(obj ?? null);
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  for (let i = 0; i < s.length; i += 1) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 + c + i, 2654435761) >>> 0;
  }
  return `${h1.toString(16)}-${h2.toString(16)}-${s.length}`;
}

const LEDGER_ERR_CONFLICT = 'ledger_conflict';

/**
 * 台帳は 2 段構え。
 *  ledger    … 結果まで保持する直近分（同じ内容を返し直せる）
 *  ledgerIds … requestId → 本文ハッシュのみの長期記録（結果は返せないが二重処理は防ぐ）
 * @returns {{state:'new'} | {state:'replay', result:any} | {state:'processed'} | {state:'conflict'}}
 */
function ledgerLookup(profile, requestId, body) {
  if (!requestId) return { state: 'new' };
  const hash = bodyHash(body);
  const hit = profile.ledger?.[requestId];
  if (hit) return hit.hash !== hash ? { state: 'conflict' } : { state: 'replay', result: hit.result };
  const known = profile.ledgerIds?.[requestId];
  if (known != null) return known !== hash ? { state: 'conflict' } : { state: 'processed' };
  return { state: 'new' };
}

function ledgerRecord(profile, requestId, body, result, limits) {
  if (!requestId) return;
  const hash = bodyHash(body);
  profile.ledger = profile.ledger || {};
  profile.ledgerIds = profile.ledgerIds || {};
  profile.ledger[requestId] = { hash, result, at: Date.now() };
  profile.ledgerIds[requestId] = hash;
  pruneLedger(profile, limits);
}

/**
 * 保持上限を整える。結果つきの記録は容量の都合で絞るが、
 * 二重処理の判定に使う ID 記録は「直近 100 件」よりはるかに長く保つ。
 */
function pruneLedger(profile, limits = {}) {
  const full = Number.isFinite(limits.full) ? limits.full : 20000;
  const ids = Number.isFinite(limits.ids) ? limits.ids : 50000;
  const maxAgeMs = Number.isFinite(limits.maxAgeMs) ? limits.maxAgeMs : 90 * 24 * 3600 * 1000;

  const entries = Object.entries(profile.ledger || {});
  if (entries.length > full || entries.length >= 2000) {
    const cutoff = Date.now() - maxAgeMs;
    const kept = entries.filter(([, v]) => (v.at || 0) >= cutoff);
    kept.sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
    profile.ledger = Object.fromEntries(kept.slice(0, full));
  }
  const idKeys = Object.keys(profile.ledgerIds || {});
  if (idKeys.length > ids) {
    // 挿入順に古いものから落とす
    const drop = idKeys.slice(0, idKeys.length - ids);
    for (const k of drop) delete profile.ledgerIds[k];
  }
}

/* ───────────────────────── ガチャ実行 ───────────────────────── */

function effectiveWeights(profile) {
  if (profile.gachaRates) {
    const v = ratesToWeights(profile.gachaRates);
    if (v.ok) return v.weights;
  }
  return defaultWeights();
}

function currentOfferRates(profile) {
  return offerRates(effectiveWeights(profile));
}

/**
 * ガチャを引く。残高消費・所持追加・XP・履歴を一括で確定する。
 * 例外時は profile を一切変更しない（内部で複製してから差し替える）。
 *
 * @returns {{ok:true, result:object} | {ok:false, code:string, message:string}}
 */
function pullGacha(profile, { count, requestId, randomInt, ledgerLimits }) {
  const n = Number(count);
  if (![1, 10].includes(n)) return { ok: false, code: 'bad_count', message: 'ガチャは1回または10回だけ実行できます。' };
  const body = { op: 'gacha', count: n };

  const look = ledgerLookup(profile, requestId, body);
  if (look.state === 'replay') return { ok: true, result: look.result, replay: true };
  if (look.state === 'processed') {
    return { ok: true, processed: true, result: null, replay: true, message: 'この操作はすでに確定済みです（結果の詳細は保持期間を過ぎています）。' };
  }
  if (look.state === 'conflict') return { ok: false, code: LEDGER_ERR_CONFLICT, message: '同じ操作IDで内容の異なる要求が届きました。' };

  const cost = GACHA_COST_SINGLE * n;
  if (profile.perica < cost) {
    return { ok: false, code: 'insufficient', message: `ペリカが足りません（必要 ${cost} / 所持 ${profile.perica}）。` };
  }

  const weights = effectiveWeights(profile);
  const rates = weightsToRates(weights);

  let items;
  try {
    // 抽選を先に全て済ませる。途中で失敗しても何も消費しない。
    items = drawMany(n, weights, randomInt);
  } catch (e) {
    return { ok: false, code: e.code || 'draw_failed', message: e.message || '抽選に失敗しました。' };
  }

  // ここから確定処理（同期・例外なし）
  const seenNew = new Set();
  const entries = [];
  let dupPlayerXp = 0;
  const now = Date.now();

  for (const item of items) {
    const parsed = parseDrawId(item.drawId);
    let isNew = false;
    if (parsed.kind === 'character') {
      const rec = profile.chars[parsed.id];
      isNew = !rec.owned && !seenNew.has(item.drawId);
      if (isNew) { rec.owned = true; seenNew.add(item.drawId); }
      rec.count += 1;
      if (!isNew) rec.xp += DUP_CHAR_XP;
    } else {
      const had = (profile.cosmetics[parsed.id] || 0) > 0;
      isNew = !had && !seenNew.has(item.drawId);
      if (isNew) seenNew.add(item.drawId);
      profile.cosmetics[parsed.id] = (profile.cosmetics[parsed.id] || 0) + 1;
      if (!isNew) { profile.playerXp += DUP_PLAYER_XP; dupPlayerXp += DUP_PLAYER_XP; }
    }
    entries.push({
      drawId: item.drawId, kind: parsed.kind, refId: parsed.id,
      name: item.name, rarity: item.rarity, slot: item.slot ?? null, isNew,
      at: now, rates,
    });
  }

  profile.perica -= cost;
  profile.gachaHistory.push(...entries.map((e) => ({
    at: e.at, drawId: e.drawId, name: e.name, rarity: e.rarity, isNew: e.isNew, rates: e.rates,
  })));
  if (profile.gachaHistory.length > GACHA_HISTORY_LIMIT) {
    profile.gachaHistory = profile.gachaHistory.slice(-GACHA_HISTORY_LIMIT);
  }
  profile.updatedAt = now;

  const result = { count: n, cost, entries, balance: profile.perica, dupPlayerXp, rates };
  ledgerRecord(profile, requestId, body, result, ledgerLimits);
  return { ok: true, result };
}

/* ───────────────────────── 育成 ───────────────────────── */

function trainCharacter(profile, { charId, requestId, ledgerLimits }) {
  const body = { op: 'train', charId };
  const look = ledgerLookup(profile, requestId, body);
  if (look.state === 'replay') return { ok: true, result: look.result, replay: true };
  if (look.state === 'processed') {
    return { ok: true, processed: true, result: null, replay: true, message: 'この操作はすでに確定済みです。' };
  }
  if (look.state === 'conflict') return { ok: false, code: LEDGER_ERR_CONFLICT, message: '同じ操作IDで内容の異なる要求が届きました。' };

  if (!CHARACTER_BY_ID[charId]) return { ok: false, code: 'bad_char', message: 'そのキャラクターは存在しません。' };
  if (!ownsCharacter(profile, charId)) return { ok: false, code: 'not_owned', message: 'そのキャラクターを所持していません。' };
  if (profile.perica < TRAIN_COST_PERICA) {
    return { ok: false, code: 'insufficient', message: `ペリカが足りません（必要 ${TRAIN_COST_PERICA}）。` };
  }
  profile.perica -= TRAIN_COST_PERICA;
  profile.chars[charId].xp += TRAIN_CHAR_XP;
  profile.updatedAt = Date.now();

  const result = { charId, xp: profile.chars[charId].xp, level: charLevel(profile.chars[charId].xp), balance: profile.perica };
  ledgerRecord(profile, requestId, body, result, ledgerLimits);
  return { ok: true, result };
}

/* ───────────────────────── 対戦報酬 ───────────────────────── */

/**
 * 試合報酬を付与する。matchId ＋ ユーザーで一度だけ。
 * @param {'win'|'lose'|'draw'|'aborted'} outcome
 */
function grantMatchReward(profile, { matchId, outcome, charId, stonesPlaced = 0, skillsUsed = 0 }) {
  if (!matchId) return { ok: false, code: 'bad_match', message: '試合IDがありません。' };
  if (profile.rewardedMatches[matchId]) {
    return { ok: true, result: { duplicated: true, perica: 0, playerXp: 0, charXp: 0, balance: profile.perica } };
  }
  const kind = ['win', 'lose', 'draw', 'aborted'].includes(outcome) ? outcome : 'aborted';
  const perica = REWARD_PERICA[kind];
  const pXp = REWARD_PLAYER_XP[kind];
  const cXp = REWARD_CHAR_XP[kind];

  profile.perica += perica;
  profile.playerXp += pXp;
  if (charId && profile.chars[charId]) profile.chars[charId].xp += cXp;

  // カウンタ（ミッション用）
  profile.counters.stonesPlaced += Math.max(0, Math.floor(stonesPlaced));
  profile.counters.skillsUsed += Math.max(0, Math.floor(skillsUsed));
  if (kind !== 'aborted') {
    profile.counters.matchesCompleted += 1;
    if (charId && !profile.counters.charsUsed.includes(charId)) profile.counters.charsUsed.push(charId);
  }
  if (kind === 'win') profile.counters.wins += 1;

  profile.rewardedMatches[matchId] = true;
  profile.updatedAt = Date.now();
  return { ok: true, result: { duplicated: false, outcome: kind, perica, playerXp: pXp, charXp: cXp, balance: profile.perica } };
}

/* ───────────────────────── 物語 ───────────────────────── */

/** 挑戦できるステージか（前のステージを制覇していること） */
function canEnterStage(profile, stageId) {
  const id = Number(stageId);
  if (!STAGE_BY_ID[id]) return { ok: false, code: 'no_stage', message: 'そのステージはありません。' };
  if (id === 1) return { ok: true };
  if (profile.story?.cleared[id - 1]) return { ok: true };
  return { ok: false, code: 'locked', message: '前のステージを先に越えてください。' };
}

/**

/**
 * 暗号学的乱数のみを使う整数乱数。
 * 安全な乱数が使えない場合はエラーにし、Math.random へフォールバックしない。

  constructor() {
    super('安全な乱数が利用できないため、抽選を実行できません。');
    this.code = 'insecure_random';
  }
}

function getCryptoObj() {
  const c = globalThis.crypto;
  if (c && typeof c.getRandomValues === 'function') return c;
  return null;
}

function hasSecureRandom() {
  return getCryptoObj() !== null;
}

/**
 * [0, maxExclusive) の一様乱数整数。剰余バイアスを除去するため棄却法を使う。
 * @param {number} maxExclusive
 */
function secureRandomInt(maxExclusive) {
  if (!Number.isInteger(maxExclusive) || maxExclusive <= 0) {
    throw new RangeError('maxExclusive は 1 以上の整数である必要があります');
  }
  const c = getCryptoObj();
  if (!c) throw new InsecureRandomError();
  if (maxExclusive === 1) return 0;

  const limit = Math.floor(0x1_0000_0000 / maxExclusive) * maxExclusive;
  const buf = new Uint32Array(1);
  for (let attempt = 0; attempt < 1000; attempt += 1) {
    c.getRandomValues(buf);
    if (buf[0] < limit) return buf[0] % maxExclusive;
  }
  throw new InsecureRandomError();
}

function secureHexUpper(length) {
  const c = getCryptoObj();
  if (!c) throw new InsecureRandomError();
  const bytes = new Uint8Array(Math.ceil(length / 2));
  c.getRandomValues(bytes);
  let s = '';
  for (const b of bytes) s += b.toString(16).padStart(2, '0');
  return s.slice(0, length).toUpperCase();
}

function secureToken(bytes = 32) {
  const c = getCryptoObj();
  if (!c) throw new InsecureRandomError();
  const arr = new Uint8Array(bytes);
  c.getRandomValues(arr);
  let s = '';
  for (const b of arr) s += b.toString(16).padStart(2, '0');

      count: Number(count),
      requestId: requestId || newRequestId(),
      randomInt: secureRandomInt,
      ledgerLimits: LEDGER_LIMITS,

    if (!r.replay) await this._writeProfile();

  }

  async _train({ charId, requestId }) {
    const r = trainCharacter(this.profile, {
      charId: String(charId || ''),
      requestId: requestId || newRequestId(),
      ledgerLimits: LEDGER_LIMITS,
    });

    if (!r.replay) await this._writeProfile();

  }

    const r = equipCosmetic(this.profile, { slot: String(slot || ''), id: String(id || ''), charId: charId ? String(charId) : null });

    const r = claimMission(this.profile, String(missionId || ''));
    if (!r.ok) return fail('mission_rejected', r.message);
    await this._writeProfile();
    this._publish();
    return done({ mission: r.result });
  }
}
