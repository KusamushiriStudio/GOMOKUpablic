<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#14432f">
<title>TRIAD — 超次元五目</title>
<style>/* TRIAD — 超次元五目 : 和風UI
   基調色: 深い緑 / 生成り / 淡い緑 */

:root {
  --green-900: #0e2f21;
  --green-800: #14432f;
  --green-700: #1f6f4a;
  --green-500: #3f8f5c;
  --green-200: #cfe0cd;
  --green-100: #e4eede;
  --cream: #f4efe1;
  --cream-2: #eae2cd;
  --ink: #24301f;
  --ink-soft: #55604c;
  --sumi: #2b2b2b;
  --accent: #c0362c;
  --gold: #c9a227;
  --p1: #1f6f4a;
  --p2: #b5462f;
  --p3: #2f5d94;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(20, 45, 30, .16);
  --nav-h: 60px;
  --header-h: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

/* hidden 属性を必ず優先する（display を明示した要素が操作を奪わないように） */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  max-width: 100%;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100svh;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(63, 143, 92, .10), transparent 46%),
    radial-gradient(circle at 88% 92%, rgba(20, 67, 47, .10), transparent 44%);
}

button { font-family: inherit; font-size: inherit; color: inherit; }

.app {
  display: flex;
  flex-direction: column;
  min-height: 100svh;
}

/* ───────── ヘッダー ───────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: calc(6px + var(--safe-t)) 10px 6px;
  min-height: var(--header-h);
  background: linear-gradient(180deg, var(--green-800), var(--green-900));
  color: var(--cream);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
}
.brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.brand-mark {
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--green-200) 60%, var(--green-500));
  flex: none; align-self: center;
}
.brand-name { font-family: var(--font); font-size: 19px; letter-spacing: .14em; font-weight: 700; }
.brand-sub { font-size: 10px; opacity: .78; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 6px; flex: none; }
.badge {
  font-size: 10px; letter-spacing: .1em; padding: 3px 7px; border-radius: 999px;
  border: 1px solid rgba(244, 239, 225, .5);
}
.badge[data-mode="ONLINE"] { background: var(--gold); color: #34280a; border-color: transparent; font-weight: 700; }
.perica {
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(244, 239, 225, .14); border-radius: 999px; padding: 3px 9px;
  font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700;
}
.perica-mark { color: var(--gold); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(244, 239, 225, .4);
  background: transparent; color: var(--cream); cursor: pointer; line-height: 1;
}
.icon-btn[aria-pressed="true"] { background: var(--accent); border-color: transparent; }

/* ───────── メイン ───────── */
.app-main {
  flex: 1 1 auto;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 10px calc(var(--nav-h) + var(--safe-b) + 18px);
  outline: none;
}
.app-main.has-actionbar { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 96px); }

/* ───────── ナビ ───────── */
.app-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: linear-gradient(180deg, #1b5439, var(--green-900));
  padding-bottom: var(--safe-b);
  border-top: 1px solid rgba(244, 239, 225, .18);
}
.app-nav button {
  appearance: none; border: 0; background: transparent; color: rgba(244, 239, 225, .72);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--nav-h); font-size: 10px; cursor: pointer; padding: 0 2px; min-width: 0;
}
.app-nav button .nav-ico { font-size: 17px; font-family: var(--font); line-height: 1; }
.app-nav button[aria-current="page"] { color: #fff; background: rgba(244, 239, 225, .12); }

/* ───────── 共通パーツ ───────── */
.card {
  background: #fffdf6;
  border: 1px solid var(--cream-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
  margin-bottom: 12px;
}
.card > h2, .section-title {
  margin: 0 0 8px;
  font-family: var(--font);
  font-size: 15px;
  letter-spacing: .08em;
  color: var(--green-800);
  display: flex; align-items: center; gap: 7px;
}
.section-title::before {
  content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--green-700);
}
.muted { color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }

.btn {
  appearance: none; border: 1px solid var(--green-700); border-radius: 10px;
  background: var(--green-700); color: #fff; padding: 10px 14px; font-weight: 700;
  cursor: pointer; min-height: 44px; font-size: 14px; line-height: 1.2;
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--green-800); }
.btn.sub { background: #fff; color: var(--green-800); border-color: var(--cream-2); }
.btn.danger { background: var(--accent); border-color: var(--accent); }
.btn.gold { background: linear-gradient(180deg, #d9b843, #b48c1c); border-color: #9c7a17; color: #33280a; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--cream-2); background: #fff; border-radius: 999px;
  padding: 6px 11px; font-size: 12px; cursor: pointer; min-height: 34px;
}
.chip[aria-pressed="true"] { background: var(--green-700); color: #fff; border-color: var(--green-700); }

.pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
.pill.SSR { background: linear-gradient(90deg, #f6d365, #c9a227); color: #3a2c05; }
.pill.SR { background: #cbb6e8; color: #34204f; }
.pill.R { background: #b9d7ef; color: #17364f; }
.pill.N { background: var(--green-100); color: var(--green-800); }
.pill.new { background: var(--accent); color: #fff; }
.pill.dup { background: #ddd6c4; color: #4b4433; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }

.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; }
.kv b { font-variant-numeric: tabular-nums; }

.bar { height: 6px; border-radius: 3px; background: var(--cream-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green-500); }

.notice {
  border-left: 4px solid var(--gold); background: #fdf6e3; padding: 8px 10px;
  border-radius: 8px; font-size: 12px; line-height: 1.6; margin-bottom: 10px;
}
.notice.error { border-left-color: var(--accent); background: #fdecea; }

/* ───────── 盤面 ───────── */
.board-wrap {
  position: relative;
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--cream-2);
  box-shadow: var(--shadow);
  background: var(--cream-2);
  touch-action: manipulation;
}
.board-scroll { max-height: min(62svh, 620px); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.board-svg { display: block; width: 100%; height: auto; }
.board-svg .hit { fill: transparent; }

.turn-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.seat-card {
  border: 1px solid var(--cream-2); border-radius: 10px; background: #fffdf6; padding: 6px;
  font-size: 11px; position: relative; overflow: hidden; min-width: 0;
}
.seat-card[data-active="true"] { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(31,111,74,.18); }
.seat-card[data-disconnected="true"] { opacity: .6; }
.seat-head { display: flex; align-items: center; gap: 4px; font-weight: 700; }
.seat-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.seat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-meta { display: flex; gap: 6px; margin-top: 3px; color: var(--ink-soft); font-size: 10px; flex-wrap: wrap; }
.seat-art { display: flex; justify-content: center; margin: 2px 0; }
.seat-art svg { width: 40px; height: 50px; }
.energy-dots { display: flex; gap: 2px; margin-top: 4px; }
.energy-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--cream-2); display: block; }
.energy-dots i.on { background: var(--gold); }

/* 確定バー */
.action-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--nav-h) + var(--safe-b));
  z-index: 35;
  background: rgba(255, 253, 246, .97);
  border-top: 1px solid var(--cream-2);
  box-shadow: 0 -3px 14px rgba(20, 45, 30, .14);
  padding: 8px 10px;
}
.action-bar-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.action-bar .label { flex: 1 1 auto; font-size: 12px; line-height: 1.35; min-width: 0; }
.action-bar .label b { font-size: 14px; }

/* ───────── キャラ表示 ───────── */
.char-card {
  border: 1px solid var(--cream-2); border-radius: 12px; background: #fffdf6;
  padding: 8px; text-align: center; cursor: pointer; min-width: 0;
}
.char-card[aria-pressed="true"] { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(31,111,74,.18); }
.char-card[data-locked="true"] { opacity: .5; }
.char-card .name { font-size: 12px; font-weight: 700; margin-top: 4px; }
.char-card .sub { font-size: 10px; color: var(--ink-soft); }
.char-art { width: 100%; height: auto; display: block; }

.item-card {
  border: 1px solid var(--cream-2); border-radius: 10px; background: #fffdf6; padding: 6px;
  text-align: center; cursor: pointer; font-size: 11px; min-width: 0;
}
.item-card[aria-pressed="true"] { border-color: var(--green-700); box-shadow: 0 0 0 2px rgba(31,111,74,.18); }
.item-card .thumb { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--cream-2); }
.item-card .thumb svg { width: 100%; height: 100%; display: block; }
.item-card .nm { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-card .eq { color: var(--green-700); font-weight: 700; font-size: 10px; }

/* ───────── ガチャ結果 ───────── */
.gacha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.gacha-cell { border-radius: 10px; padding: 6px; text-align: center; border: 1px solid var(--cream-2); background: #fffdf6; }
.gacha-cell.is-new { box-shadow: 0 0 0 2px var(--accent) inset; }

/* ───────── 表 ───────── */
.table { width: 100%; border-collapse: collapse; font-size: 11px; }
.table th, .table td { border-bottom: 1px solid var(--cream-2); padding: 5px 4px; text-align: left; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; max-width: 100%; }

/* ───────── 入力 ───────── */
input[type="text"], input[type="number"], select {
  font: inherit; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--cream-2);
  background: #fff; color: var(--ink); min-height: 42px; width: 100%; max-width: 100%;
}
input[type="range"] { width: 100%; }
label.field { display: block; font-size: 12px; margin-bottom: 8px; }
label.field > span { display: block; margin-bottom: 4px; color: var(--ink-soft); }
.code-input { letter-spacing: .34em; text-transform: uppercase; font-family: ui-monospace, monospace; text-align: center; font-size: 20px; }

/* ───────── トースト・ダイアログ ───────── */
.toast-layer {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
  z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center;
  width: min(94vw, 520px); pointer-events: none;
}
.toast {
  background: rgba(20, 45, 30, .94); color: var(--cream); padding: 9px 13px; border-radius: 10px;
  font-size: 12.5px; line-height: 1.5; box-shadow: var(--shadow); max-width: 100%;
  animation: toastIn .18s ease-out;
}
.toast.error { background: #7c1f18; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.dialog-layer {
  position: fixed; inset: 0; z-index: 70; background: rgba(14, 30, 22, .5);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.dialog {
  background: #fffdf6; border-radius: 16px; padding: 16px; width: min(94vw, 400px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
}
.dialog h3 { margin: 0 0 8px; font-family: var(--font); font-size: 16px; color: var(--green-800); }
.dialog p { margin: 0 0 14px; font-size: 13px; line-height: 1.65; }
.dialog .row { justify-content: flex-end; }

/* ───────── 演出レイヤー ───────── */
.fx-layer {
  position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden;
}
.fx-banner {
  position: absolute; left: 50%; top: 16%; transform: translateX(-50%);
  background: rgba(20, 45, 30, .9); color: var(--cream); padding: 8px 18px; border-radius: 999px;
  font-family: var(--font); letter-spacing: .12em; font-size: 15px; white-space: nowrap;
  animation: fxBanner 1.1s ease-out forwards;
}
@keyframes fxBanner {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); }
  16% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -8px); }
}
.fx-node { position: absolute; pointer-events: none; }

/* 結界破壊で回復したエナジーの表示（文字だけ。盤面には影響しない） */
.fx-energy {
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .06em;
  color: #ffe9a3;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .75), 0 0 8px rgba(201, 162, 39, .8);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  .fx-node, .fx-banner { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  * { scroll-behavior: auto !important; }
}

/* ───────── PC: サイドバー ───────── */
@media (min-width: 900px) {
  .app { flex-direction: row; }
  .app-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 45;
  }
  .app-nav {
    position: fixed; top: var(--header-h); bottom: 0; left: 0; right: auto;
    width: 168px; grid-template-columns: 1fr; align-content: start;
    padding-top: 10px; border-top: 0; border-right: 1px solid rgba(244, 239, 225, .18);
  }
  .app-nav button { flex-direction: row; justify-content: flex-start; gap: 10px; height: 46px; padding: 0 16px; font-size: 13px; }
  .app-main {
    margin-left: 168px; margin-top: var(--header-h);
    max-width: 760px; padding-bottom: 120px;
  }
  .app-main.has-actionbar { padding-bottom: 140px; }
  .action-bar { left: 168px; bottom: 0; }
  .action-bar-inner { max-width: 760px; margin: 0 0 0 8px; }
  .toast-layer { bottom: 90px; }
  .board-scroll { max-height: min(72svh, 760px); }
}

/* 極小幅 */
@media (max-width: 340px) {
  .brand-sub { display: none; }
  .app-nav button { font-size: 9px; }
  .app-main { padding-left: 8px; padding-right: 8px; }
  .card { padding: 10px; }
}

/* ───────────────── 物語：季節と天候の情景 ───────────────── */

.scene {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  padding: 14px 14px 12px;
  margin: -2px 0 10px;
  color: var(--ink);
  background: linear-gradient(180deg, var(--scene-top, #e8dcc0), var(--scene-bottom, #d6d8be));
  border: 1px solid rgba(0, 0, 0, .08);
}
.scene.dark { color: #f2ece0; }
.scene.dark .scene-sub { color: rgba(242, 236, 224, .78); }
.scene-title { font-family: var(--font); font-size: 15px; letter-spacing: .06em; font-weight: 700; }
.scene-sub { font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin-top: 4px; }
.scene-body { position: relative; z-index: 1; }

/* 季節ごとの地色 */
.scene[data-season="spring"] { --scene-top: #f4e3e8; --scene-bottom: #e6d3d9; }
.scene[data-season="rainy"]  { --scene-top: #dfe7e6; --scene-bottom: #c6d3d1; }
.scene[data-season="summer"] { --scene-top: #f6e2cf; --scene-bottom: #e8c6a6; }
.scene[data-season="autumn"] { --scene-top: #f2ddcd; --scene-bottom: #e2bfa8; }
.scene[data-season="winter"] { --scene-top: #e6eef5; --scene-bottom: #ccdae6; }
.scene[data-season="all"]    { --scene-top: #ece5d6; --scene-bottom: #d9d4c0; }

/* 夜・虚空は暗く */
.scene[data-time="night"], .scene[data-time="void"] { --scene-top: #2a2436; --scene-bottom: #1b1726; }
.scene[data-time="evening"] { --scene-top: #f0d7c0; --scene-bottom: #d9ab8d; }
.scene[data-time="dawn"] { --scene-top: #efe0e6; --scene-bottom: #d7c8d6; }

/* 天候の粒（動きが苦手な人には止める） */
.scene-fx { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .55; }
.scene-fx i {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: var(--fx-color, #fff);
  animation: scene-fall var(--fx-dur, 7s) linear infinite;
  animation-delay: var(--fx-delay, 0s);
}
.scene[data-weather="petals"] .scene-fx i,
.scene[data-weather="maple-storm"] .scene-fx i { border-radius: 40% 60% 45% 55%; }
.scene[data-weather="petals"] .scene-fx { --fx-color: #f0c2cf; }
.scene[data-weather="maple-storm"] .scene-fx { --fx-color: #c9603f; }
.scene[data-weather="rain"] .scene-fx i,
.scene[data-weather="storm"] .scene-fx i,
.scene[data-weather="thunder"] .scene-fx i { border-radius: 2px; width: 1.5px !important; height: 11px !important; }
.scene[data-weather="rain"] .scene-fx { --fx-color: #9fb8c4; }
.scene[data-weather="storm"] .scene-fx { --fx-color: #cfe0ea; opacity: .75; }
.scene[data-weather="snow"] .scene-fx,
.scene[data-weather="blizzard"] .scene-fx { --fx-color: #ffffff; }
.scene[data-weather="ash"] .scene-fx { --fx-color: #d8cfc4; }
.scene[data-weather="firestorm"] .scene-fx { --fx-color: #e8894a; opacity: .8; }
.scene[data-weather="fog"] .scene-fx { --fx-color: #e9e3ee; opacity: .3; }
.scene[data-weather="aurora"] .scene-fx { --fx-color: #8fe0c6; opacity: .5; }
.scene[data-weather="clear"] .scene-fx,
.scene[data-weather="haze"] .scene-fx,
.scene[data-weather="void"] .scene-fx,
.scene[data-weather="shifting"] .scene-fx { display: none; }

@keyframes scene-fall {
  from { transform: translate3d(0, -20%, 0) rotate(0deg); }
  to { transform: translate3d(var(--fx-drift, 12px), 320%, 0) rotate(220deg); }
}
@media (prefers-reduced-motion: reduce) {
  .scene-fx i { animation: none; opacity: .35; }
}

/* ───────────────── 物語：ボスの段階変化 ───────────────── */

.boss-figure { position: relative; display: inline-block; }
.boss-figure[data-phase="1"] .char-art { filter: saturate(1.25) contrast(1.08); }
.boss-figure[data-phase="2"] .char-art { filter: saturate(1.5) contrast(1.2) hue-rotate(-12deg); }
.boss-figure[data-phase="1"]::after,
.boss-figure[data-phase="2"]::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(230, 120, 60, .30), transparent 68%);
  animation: boss-pulse 2.4s ease-in-out infinite;
}
.boss-figure[data-phase="2"]::after {
  background: radial-gradient(circle, rgba(200, 60, 90, .42), transparent 66%);
  animation-duration: 1.4s;
}
@keyframes boss-pulse {
  0%, 100% { opacity: .45; transform: scale(1); }
  50% { opacity: .9; transform: scale(1.06); }
}
@media (prefers-reduced-motion: reduce) {
  .boss-figure::after { animation: none; }
}
.boss-phase-line {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}

/* 確定前の注意（引力で相手を勝たせる場合など） */
.warn-line {
  margin-top: 3px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.4;
}

/* ボスの登場・勝利演出（文字と絵だけ。盤面には影響しない） */
.boss-show .boss-figure .char-art { filter: saturate(1.2) contrast(1.06); }
.boss-show[data-kind="win"] .boss-figure .char-art { filter: saturate(.7) opacity(.85); }
</style>
